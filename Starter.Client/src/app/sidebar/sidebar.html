<aside
    class="h-full bg-white border-r border-gray-200 w-60 shadow-lg transition-transform duration-300 ease-in-out fixed left-0 top-0 z-50 md:translate-x-0 md:shadow-none md:static"
    [class.translate-x-0]="isOpen" [class.-translate-x-full]="!isOpen">

    <div class="p-4 border-b border-gray-200 flex justify-between items-center md:hidden">
        <h2 class="text-lg font-semibold text-gray-800">Menu</h2>
        <button (click)="toggleSidebar.emit()" class="p-2 rounded-md hover:bg-gray-100 transition-colors">
            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>

    <nav class="p-4">
        <ul class="space-y-1">
            <li>
                <a routerLink="/dashboard" routerLinkActive="bg-gray-100 text-gray-900"
                    class="block px-4 py-2 text-gray-600 hover:bg-gray-100 hover:text-gray-900 rounded-md transition-colors text-sm font-medium">
                    Dashboard
                </a>
            </li>
        </ul>
    </nav>
</aside>

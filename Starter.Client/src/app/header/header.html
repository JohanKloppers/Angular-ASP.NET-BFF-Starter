<header class="bg-white shadow-sm border-b border-gray-200 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center">
        <h1 class="text-xl font-semibold text-gray-800">Starter</h1>
    </div>

    <div class="flex items-center space-x-4">
        @if (!isAuthenticated()) {
        <button (click)="signIn()"
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors">
            Sign In
        </button>
        }

        @if (isAuthenticated()) {
        <div class="relative user-menu-container">
            <button (click)="toggleUserMenu()"
                class="w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center cursor-pointer hover:bg-gray-400 transition-colors">
                <svg class="w-5 h-5 text-gray-600" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                        clip-rule="evenodd"></path>
                </svg>
            </button>

            @if (isUserMenuOpen()) {
            <div class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg border border-gray-200 z-50">
                <div class="py-1">
                    <div class="border-t border-gray-100"></div>
                    <button (click)="signOut()"
                        class="w-full text-left block px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
                        Sign Out
                    </button>
                </div>
            </div>
            }
        </div>

        <button (click)="toggleSidebar()"
            class="md:hidden p-2 rounded-md hover:bg-gray-100 transition-colors">
            <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        }
    </div>
</header>

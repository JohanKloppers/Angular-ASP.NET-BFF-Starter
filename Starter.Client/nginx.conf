server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Auth action endpoints: POST goes to BFF, GET serves Angular (direct navigation)
    location ~ ^/(login|register)$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($request_method = POST) {
            proxy_pass http://bff:8080;
        }
        try_files $uri /index.html;
    }

    # BFF-only routes — always proxied regardless of method
    location ~ ^/(logout|user|health|api) {
        proxy_pass http://bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular HTML5 routing — serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}

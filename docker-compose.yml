services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starterdb}
      POSTGRES_USER: ${POSTGRES_USER:-starter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starter_dev_pass}
    ports:
      - "5532:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starter} -d ${POSTGRES_DB:-starterdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./Starter.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-starterdb};Username=${POSTGRES_USER:-starter};Password=${POSTGRES_PASSWORD:-starter_dev_pass}"
      ApiKey__Value: "${API_INTERNAL_KEY:-changeme-internal-api-key}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  bff:
    build:
      context: ./Starter.Bff
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      Api__BaseUrl: "http://api:8080"
      Api__InternalKey: "${API_INTERNAL_KEY:-changeme-internal-api-key}"
      ReverseProxy__Clusters__api-cluster__Destinations__api-destination__Address: "http://api:8080/"
    ports:
      - "5000:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  client:
    build:
      context: ./Starter.Client
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      bff:
        condition: service_healthy

volumes:
  postgres_data:
